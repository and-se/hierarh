{% extends "edit/base-edit.html" %}
{% block content %}
<main>
    <style>
        h1 {
            font-size: 1.5rem;
        }

        body {
            grid-template-columns: 1fr min(900px, 90%) 1fr;
        }

        table.problems {
            font-size: 12pt;
            width: 100%;

            thead th {
                text-align: center;               
            }

            tbody td:first-child {
                width: 30%;
            }

            input-select {
                width: 90%;
            }
        }

        .next-task{
            text-align:right;
        }

        input-select {
            padding:0.5rem;
        }

        input-select[data-key], input-select[data-nolink] {
            border-left: 8px solid green;
            transition: linear 0.1s;
        }
    </style>    
    <div style="display:none">
        <p id="question-init-data">
            {{task.raw_question()}}
        </p>
        <p id="answer-init-data">
            {{task.raw_answer() or ''}}
        </p>
    </div>

    <h1>
        <a href="/edit/episkop/{{task.doc_key}}" target="_blank" class="title"></a>
    </h1>
    
    <table class="problems hhtable">
        <thead>
            <tr><th>проблема</th><th>решение</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <label>Комментарий
    <textarea class="comment"></textarea>
    </label>
    

    {% if next_task %}
        <div class="next-task">
            <hr>
            <a href="/edit/task/{{next_task}}">следующая задача</a>
        </div>
    {% endif %}
    
    <script>
        'use strict'
        let Q = document.getElementById('question-init-data')
        let A = document.getElementById('answer-init-data')
        Q = JSON.parse(Q.innerText.trim() || 'null') || {}
        A = JSON.parse(A.innerText.trim() || 'null') || {}

        document.querySelector('.title').innerText = Q.title || ''

        let $problemsTable = document.querySelector('.problems tbody')
        let $commentArea = document.querySelector('.comment')

        for (const pr of Q.problems) {
            let es = LIB.escapeForHtml
            let row = LIB.createElementByHtml(`
            <tr data-where="${pr.where}">
                <td>${es(pr.item)} - ${es(pr.msg)}</td>
                <td><input-select suggest="suggestCafedra" class="answer">введите что-то</input-select>
                    <a class="info" target="_blank">==></a>
                </td>
            </tr>
            `)

            $problemsTable.append(row)
        }
    </script>
    <script src="/static/edit/input-select.js"></script>
    <script>
        // После прогрузки всех input-select правим их состояние
        document.addEventListener('DOMContentLoaded', () => {
            for (const ans of A.answers) {
                let t = $problemsTable.querySelector(`[data-where='${ans.where}'] .answer`)

                t.value = ans.value
                if(ans.key) {
                    t.dataset.key = ans.key
                    setInfoTag(t.parentElement.querySelector('a.info'), ans.key)
                }
                if(ans.nolink) t.dataset.nolink = ans.nolink
            }
            if (A.comment) $commentArea.value = A.comment
        })

        document.addEventListener('change', saveTaskAnswer)
        window.addEventListener('beforeunload', saveTaskAnswer)

        function suggestCafedra(v, cancel) {
            if (!v.trim()) return [{value: 'ссылка не нужна', nolink:"true"}]

            return fetch("/edit/suggest/cafedra?" + new URLSearchParams({ query: v }),
                { signal: cancel, credentials: 'include' })
                .then(resp => resp.json()).then(js => {
                    let r = js.concat([
                        {value: 'ссылка не нужна (' + v + ')', nolink:"true"}
                    ])
                    
                    return r;
                })

            /*return new Promise((resolve) => {
                console.log("suggest for", v)
                resolve(["value1", "value2", v])
            })*/
        }

        let oldTaskAnswer = null
        function saveTaskAnswer() {
            let r = buildTaskAnswer()
            let json = JSON.stringify(r)
            if (json === oldTaskAnswer) return;
            oldTaskAnswer = json
            console.log(r)
            fetch('/edit/task/{{task.id}}/answer', {
                credentials: "include",
                method: "POST",
                headers: {  
                   'Content-Type': 'application/json'  
                },
                body: json
            }).then(r => r.json()).then(js => {

            })
        }
        
        function buildTaskAnswer() {
            let arr = []
            for (let ans of $problemsTable.querySelectorAll('tr .answer')) {
                let where = ans.closest('tr[data-where]').dataset.where
                let it = {where, value: ans.value}
                if (ans.dataset.key) {
                    it.key = ans.dataset.key
                } else if (ans.dataset.nolink) {
                    it.nolink = true
                }

                arr.push(it)
            }

            let res = {
                'answers': arr
            }

            if ($commentArea.value.trim()) {
                res.comment = $commentArea.value.trim()
            }

            return res
        }
    </script>

    <script>
        document.addEventListener('suggestSelected', (ev) => {
            let atag = ev.target.parentElement.querySelector('a.info')
            if (atag) {                
                if (ev.detail.key) {
                    setInfoTag(atag, ev.detail.key)                    
                } else {
                    atag.removeAttribute('href')
                    atag.removeAttribute('title')
                }
            }
        })

        function setInfoTag(atag, key) {
            atag.setAttribute('href', "/edit/cafedra/" + key)
            fetch(`/edit/cafedra/${key}/snippet`, {credentials: 'include' })
            .then(r => r.json())
            .then(js => {
                atag.closest('td').setAttribute('title', js.snippet || '')
            })
        }

        document.addEventListener('suggestOutdated', ev => {
            let atag = ev.target.parentElement.querySelector('a.info')
            if (atag) {
                atag.removeAttribute('href')
                atag.removeAttribute('title')
            }
        })
    </script>

</main>
{% endblock %}
